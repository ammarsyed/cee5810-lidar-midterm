# Gal's run of the shared simulator. Everything that makes Gal's media different from Ammar's
# lives here: room, random seed, output folder, and each experiment's poses / parameters.
# The physics (sensor, materials, noise) is shared and lives in lidar_sim/config.py.
# Poses are [x, y, heading_deg]. Use: uv run python -m experiments.run_all --person gal

name = "Gal"
scene = "variant_b"        # 9 x 6 m room (lidar_sim/scenes.py: variant_b)
seed = 100                 # base random seed for every experiment
out = "figures/gal"

[scene_options]            # passed to the room builder
box_speed = 0.4            # moving box speed [m/s]

[tour]                     # demo/tour.py and the slider app's starting pose
pose = [0.9, 2.1, 60.0]
waypoints = [[2.2, 1.2], [4.4, 2.4], [4.2, 4.4], [2.6, 4.8], [2.0, 2.6]]

[e1]                       # sensor position: straight path + beams with a closed-form wall
start = [2.6, 0.8]
end = [2.6, 3.2]
heading_deg = 90.0
beams = [[0.0, [0, 1], 6.0, "β=0°: top wall"],
         [90.0, [1, 0], 0.0, "β=+90°: left wall"]]

[e2]
pose = [4.0, 3.5]          # x, y (the heading is swept)

[e3]
pose = [1.5, 3.0, 0.0]
beam_deg = 0.0

[e4]
pose = [7.2, 3.5, 0.0]
rhos = [0.15, 0.3, 0.6, 0.8]  # reflectivities for the P_D-vs-range curves
incidence_rho = 0.7           # reflectivity for the max-range-vs-tilt plot

[e5]
pose = [0.9, 2.1, 60.0]

[e6]
glass_dist = 1.5
wall_dist = 5.0
room_pose = [3.6, 1.6, 20.0]
angle_offset_deg = 0.5     # start of the incidence-angle grid

[e7]
pose = [4.5, 4.2, -150.0]
rhos = [0.8, 0.6, 0.3]

[e8]
wall_range = 2.5           # distance of the wall for the noise histogram [m]

[e9]
range_span = 30.0          # true ranges swept [m]

[e10]
near = 1.5                 # box edge distance [m]
far = 3.5                  # wall behind it [m]

[e11]
n_seeds = 20               # particle-filter runs per scenario

[e12]
pose = [5.2, 3.0, 90.0]
ghost_pose = [0.9, 2.1, 60.0]
tilt_deg = 8.0             # mount tilt for the floor-ring plot

[e13]
pose = [3.0, 3.0, 200.0]
